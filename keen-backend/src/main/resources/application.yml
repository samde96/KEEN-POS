spring:
  application:
    name: keen-pos
  datasource:
    # Use separate properties for PostgreSQL to avoid URL parsing issues
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:keen_pos_db}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:keen_pos_user}
    password: ${DB_PASSWORD:password}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # Use 'update' for development, 'validate' or 'none' for production
    show-sql: false
    properties:
      hibernate.format_sql: true # Added this line to resolve the error
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:keen-pos-secret-key-change-in-production-environment-please-do-so-now}
  expiration: 86400000

logging:
  level:
    root: INFO
    com.keen: DEBUG