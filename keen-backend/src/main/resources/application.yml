spring:
  application:
    name: keen-pos
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:h2:file:./data/keen-pos-db;AUTO_SERVER=TRUE}
    driverClassName: org.h2.Driver
    username: ${JDBC_DATABASE_USERNAME:sa}
    password: ${JDBC_DATABASE_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:keen-pos-secret-key-change-in-production-environment-please-do-so-now}
  expiration: 86400000

logging:
  level:
    root: INFO
    com.keen: DEBUG