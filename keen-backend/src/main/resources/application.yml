spring:
  application:
    name: keen-pos
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/keen_pos_db} # Default for local dev, will be overridden by Render ENV
    driverClassName: org.postgresql.Driver
    username: ${JDBC_DATABASE_USERNAME:keen_pos_user} # Default for local dev, will be overridden by Render ENV
    password: ${JDBC_DATABASE_PASSWORD:password} # Default for local dev, will be overridden by Render ENV
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # Use 'update' for development, 'validate' or 'none' for production
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  # H2 console is disabled as we are using PostgreSQL on Render
  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:keen-pos-secret-key-change-in-production-environment-please-do-so-now}
  expiration: 86400000

logging:
  level:
    root: INFO
    com.keen: DEBUG