name: keen_pos
description: A Point of Sale application built with Flutter.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.1.0

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  dio: ^5.3.1
  
  # State Management
  provider: ^6.0.0
  
  # Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Charts
  fl_chart: ^0.65.0
  
  # UI Components
  intl: ^0.19.0
  image_picker: ^1.0.4
  
  # Icons
  flutter_svg: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
